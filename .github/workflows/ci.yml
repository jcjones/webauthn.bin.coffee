name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # assets/pkijs.js is a committed build artifact. Any change to
      # scripts/pkijs-entry.js or a pkijs/asn1js/esbuild bump must also
      # commit the rebuilt bundle.
      - name: Check assets/pkijs.js is up to date
        run: |
          npm run build
          if ! git diff --quiet -- assets/pkijs.js; then
            echo "::error file=assets/pkijs.js::Bundle is stale; run 'npm run build' and commit the result."
            exit 1
          fi

      - run: npm run lint

  # Tells the server to pull main. The endpoint sits behind Caddy's
  # validate_github, which only checks an HMAC-SHA256 of the body in
  # X-Hub-Signature-256, so we sign a minimal push-like payload ourselves.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: production
      url: https://webauthn.bin.coffee/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?DEPLOY_WEBHOOK_URL is not set}" "${WEBHOOK_SECRET:?DEPLOY_WEBHOOK_SECRET is not set}"
          body=$(jq -nc --arg ref "$GITHUB_REF" --arg after "$GITHUB_SHA" '{ref: $ref, after: $after}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl --fail-with-body -sS --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            "$WEBHOOK_URL"
